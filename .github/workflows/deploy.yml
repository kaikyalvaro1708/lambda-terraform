name: Terraform Multi-Env Pipeline

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - "*"

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 🔹 Define ambiente baseado na branch
      - name: Set environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      # 🔐 Autenticação AWS (via secrets por enquanto)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ⚙️ Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 📦 Init com backend dinâmico
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${ENV}/lambda/terraform.tfstate"

      # 🔍 Validate
      - name: Terraform Validate
        run: terraform validate

      # 🧪 PLAN (sempre roda)
      - name: Terraform Plan
        run: terraform plan -var-file="envs/${ENV}.tfvars"

      # 🚀 APPLY (somente em push, não em PR)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -var-file="envs/${ENV}.tfvars"
